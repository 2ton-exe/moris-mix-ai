project_id = "gtbwblxskctpsqhbpebg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[functions.demo-recipe]
verify_jwt = false

# Intentionally disabled at the gateway: the handler enforces authentication via authenticateRequest() and handles unauthenticated OPTIONS CORS preflight directly.
[functions.auth-session]
verify_jwt = false

[functions.recipes]
verify_jwt = false

# AI-05 extraction: the handler authenticates POST requests via authenticateRequest()
# and answers the unauthenticated OPTIONS CORS preflight directly, so the gateway
# must not require a JWT.
[functions.extract-recipe]
verify_jwt = false

# These future handlers must authenticate POST requests themselves and handle OPTIONS before authentication.
[functions.recipe-image-upload-url]
verify_jwt = false

[functions.recipe-image-attach]
verify_jwt = false

