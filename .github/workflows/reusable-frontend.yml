name: Reusable Frontend Validation

on:
  workflow_call:
    inputs:
      docs-only:
        description: Verified Stage A prose-only PR; never applies to main
        type: boolean
        default: false
    outputs:
      exists:
        description: Whether the frontend project exists
        value: ${{ jobs.frontend.outputs.exists }}

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ inputs.docs-only && github.event_name == 'pull_request' }}

    outputs:
      exists: ${{ steps.frontend.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend project not added yet."
          fi

      - name: Set up pnpm
        if: steps.frontend.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run PR Secretary regression tests
        if: hashFiles('scripts/pr-secretary.test.mjs') != ''
        working-directory: .
        run: node --test scripts/pr-secretary.test.mjs

      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test CI path classifier (offline)
        run: node --test scripts/ci-path-classifier.test.mjs

      - name: Test runtime smoke verifier (offline)
        run: node --test scripts/runtime-smoke.test.mjs

      - name: Test production workflow safety (offline)
        run: node --test scripts/production-workflow.test.mjs

      - name: Run lint
        if: env.DOCS_ONLY != 'true' && steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend tests
        if: env.DOCS_ONLY != 'true' && steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        if: env.DOCS_ONLY != 'true' && steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build

      - name: Record documentation-only validation path
        if: env.DOCS_ONLY == 'true'
        run: echo "Verified documentation-only PR - expensive application validation is not required in this context."
