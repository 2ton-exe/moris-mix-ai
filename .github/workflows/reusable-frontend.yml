name: Reusable Frontend Validation

on:
  workflow_call:
    outputs:
      exists:
        description: Whether the frontend project exists
        value: ${{ jobs.frontend.outputs.exists }}

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    outputs:
      exists: ${{ steps.frontend.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend project not added yet."
          fi

      - name: Set up pnpm
        if: steps.frontend.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run PR Secretary regression tests
        if: hashFiles('scripts/pr-secretary.test.mjs') != ''
        working-directory: .
        run: node --test scripts/pr-secretary.test.mjs

      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run lint
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend tests
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build
