name: PR Secretary

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, converted_to_draft, ready_for_review, closed, review_requested, review_request_removed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Modular PR Validation, Modular Main Validation, PR Secretary Review Signal]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: One main-target pull request number
        required: true
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions: {}

jobs:
  resolve:
    if: >-
      github.event.repository.default_branch == 'main' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.name != 'PR Secretary Review Signal' ||
       github.event.action == 'completed') &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.type == 'Bot' &&
       github.event.comment.user.login == 'coderabbitai[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      # Never use an event head/merge ref, artifacts, caches, or PR scripts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: resolve
        run: node scripts/pr-secretary.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}

  summarize:
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    concurrency:
      group: pr-secretary-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      # PR conversation comments use the writer's only write permission.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/pr-secretary.mjs summarize
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETARY_PR: ${{ matrix.pr }}
