name: PR Secretary

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, Modular PR Validation]
    types: [in_progress, completed]
  schedule:
    - cron: '17,47 * * * *'

permissions: {}

jobs:
  resolve:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.type == 'Bot' &&
       github.event.comment.user.login == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      # Never use an event head/merge ref, artifacts, caches, or PR scripts.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: resolve
        run: node scripts/pr-secretary.mjs resolve
        env:
          GH_TOKEN: ${{ github.token }}

  summarize:
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    concurrency:
      group: pr-secretary-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      # PR conversation comments use the writer's only write permission.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/pr-secretary.mjs summarize
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETARY_PR: ${{ matrix.pr }}
