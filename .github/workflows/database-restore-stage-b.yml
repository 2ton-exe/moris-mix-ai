name: Database Restore Drill (Stage B)

# No PR, push, or scheduled access to the selected production backup.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Approved recovery candidate
        required: true
        type: choice
        options:
          - backup-4
          - backup-7

permissions:
  contents: read

jobs:
  isolated-restore:
    name: Restore selected private R2 backup into disposable PostgreSQL 17
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: database-restore-drill
    concurrency:
      group: database-restore-drill
      cancel-in-progress: false
    env:
      # Official postgres:17.11-alpine multi-platform index (Docker Library).
      # Immutable client code is important because this container reads private SQL.
      PSQL_IMAGE: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      RESTORE_CANDIDATE: ${{ inputs.candidate }}
      RESTORE_PROJECT_ID: moris-restore-local
      RESTORE_DOCKER_NETWORK: moris-restore-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout reviewed restore workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Install nftables for temporary runner isolation guard
        shell: bash
        run: command -v nft >/dev/null || sudo apt-get install -y nftables

      - name: Start clean, isolated Supabase PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/moris-restore-local"
          supabase init --workdir "$workdir"
          python3 - "$workdir/supabase/config.toml" "$RESTORE_PROJECT_ID" <<'PY'
          from pathlib import Path
          import re, sys, tomllib
          path=Path(sys.argv[1])
          project_id=sys.argv[2]
          original=path.read_text(encoding='utf-8')
          updated,count=re.subn(
              r'(?m)^([ \t]*major_version[ \t]*=[ \t]*)(?:"[0-9]+"|[0-9]+)([ \t]*(?:#.*)?)$',
              r'\g<1>17\2',original)
          if count!=1 or tomllib.loads(updated)['db']['major_version']!=17:
              raise SystemExit('Disposable PostgreSQL 17 configuration failed')
          updated,count=re.subn(
              r'(?m)^project_id[ \t]*=[ \t]*"[^"]+"[ \t]*$',
              f'project_id = "{project_id}"',updated)
          if count!=1 or tomllib.loads(updated)['project_id']!=project_id:
              raise SystemExit('Disposable restore project configuration failed')
          path.write_text(updated,encoding='utf-8')
          PY
          # Start the empty database while no private archive or R2 credential
          # is present. Supabase CLI 2.122.0 performs a host-loopback readiness
          # check that can fail on an internal Docker bridge.
          if supabase --debug db start --workdir "$workdir" \
            > "$RUNNER_TEMP/private-db-start.log" 2>&1; then
            :
          else
            rc=$?
            if grep -Eiq 'ECONNREFUSED[^[:cntrl:]]*127[.]0[.]0[.]1:54322|127[.]0[.]0[.]1:54322[^[:cntrl:]]*ECONNREFUSED' \
                "$RUNNER_TEMP/private-db-start.log"; then
              echo "::error::Disposable Supabase startup failed; safe_cause=loopback-readiness-refused"
            else
              echo "::error::Disposable Supabase startup failed; safe_cause=unclassified"
            fi
            exit "$rc"
          fi
          mapfile -t db_ids < <(docker ps --filter "label=com.supabase.cli.project=$RESTORE_PROJECT_ID" \
            --filter "name=^/supabase_db_${RESTORE_PROJECT_ID}$" --format '{{.ID}}')
          if [[ "${#db_ids[@]}" != "1" ]]; then
            echo "::error::Expected one disposable PostgreSQL container"
            exit 1
          fi
          db_id="${db_ids[0]}"
          initial_networks_text="$(docker inspect --format \
            '{{range $name, $cfg := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' "$db_id")"
          # Docker appends a newline to inspect output; command substitution
          # trims it before mapfile so an empty trailing element is not counted.
          mapfile -t initial_networks <<< "$initial_networks_text"
          if [[ "${#initial_networks[@]}" != "1" || -z "${initial_networks[0]}" || \
                "${initial_networks[0]}" == "$RESTORE_DOCKER_NETWORK" ]]; then
            echo "::error::Disposable database did not start on one temporary default bridge"
            exit 1
          fi
          if docker network inspect "$RESTORE_DOCKER_NETWORK" >/dev/null 2>&1; then
            echo "::error::Disposable restore network already exists"
            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/restore-network-owned" || -e "$RUNNER_TEMP/restore-runner-network-guard.json" ]]; then
            echo "::error::Disposable restore network ownership marker already exists"
            exit 1
          fi
          docker network create --driver bridge --internal --ipv6=false \
            --label "com.supabase.cli.project=$RESTORE_PROJECT_ID" \
            --label "com.docker.compose.project=$RESTORE_PROJECT_ID" \
            "$RESTORE_DOCKER_NETWORK" >/dev/null
          printf '%s\n' "$RESTORE_DOCKER_NETWORK" > "$RUNNER_TEMP/restore-network-owned"
          chmod 600 "$RUNNER_TEMP/restore-network-owned"
          docker network connect --alias db "$RESTORE_DOCKER_NETWORK" "$db_id"
          docker network disconnect "${initial_networks[0]}" "$db_id"
          image="$(docker inspect --format '{{.Config.Image}}' "$db_id")"
          if [[ ! "$image" =~ (^|/)supabase/postgres:17\.11\.0\.006$ ]]; then
            echo "::error::Expected Supabase PostgreSQL 17.11.0.006"
            exit 1
          fi
          attached_networks="$(docker inspect --format \
            '{{range $name, $cfg := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' "$db_id")"
          if [[ "$attached_networks" != "$RESTORE_DOCKER_NETWORK" ]]; then
            echo "::error::Disposable database network transition was incomplete"
            exit 1
          fi
          network_info="$(docker network inspect --format \
            '{{.Driver}}|{{.Internal}}|{{.EnableIPv6}}|{{index .Labels "com.supabase.cli.project"}}|{{index .Labels "com.docker.compose.project"}}' \
            "$RESTORE_DOCKER_NETWORK")"
          if [[ "$network_info" != "bridge|true|false|$RESTORE_PROJECT_ID|$RESTORE_PROJECT_ID" ]]; then
            echo "::error::Disposable restore network isolation changed"
            exit 1
          fi
          binding_json="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$db_id")"
          python3 - "$binding_json" <<'PY'
          import json, sys
          try:
              bindings=json.loads(sys.argv[1])
              ports=bindings['5432/tcp']
              valid=(set(bindings)=={'5432/tcp'} and len(ports)==1 and
                     ports[0].get('HostIp') in ('', '0.0.0.0', '127.0.0.1') and
                     ports[0].get('HostPort')=='54322')
          except (KeyError, TypeError, ValueError):
              valid=False
          if not valid:
              raise SystemExit('Disposable PostgreSQL host port mapping is unexpected')
          PY
          network_client=(docker run --rm --network "$RESTORE_DOCKER_NETWORK" \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --read-only "$PSQL_IMAGE")
          server_version="$("${network_client[@]}" psql -X -A -t --no-password -v ON_ERROR_STOP=1 \
            -c 'SHOW server_version' -d 'postgresql://postgres:postgres@db:5432/postgres')"
          if [[ ! "$server_version" =~ ^17\.11([.[:space:]]|$) ]]; then
            echo "::error::Unexpected PostgreSQL server version"
            exit 1
          fi
          fresh="$("${network_client[@]}" psql -X -A -t --no-password -v ON_ERROR_STOP=1 \
            -c "SELECT (to_regclass('public.recipes') IS NULL AND to_regclass('public.profiles') IS NULL AND to_regclass('auth.users') IS NOT NULL)::int" \
            -d 'postgresql://postgres:postgres@db:5432/postgres')"
          [[ "$fresh" == "1" ]] || { echo "::error::Target is not a clean Supabase baseline"; exit 1; }
          docker exec "$db_id" pg_isready -U postgres -d postgres >/dev/null 2>&1 || {
            echo "::error::Container-local PostgreSQL readiness check failed"
            exit 1
          }
          "${network_client[@]}" sh -c 'command -v nc >/dev/null'
          # The internal bridge blocks routed container egress. The guard also
          # denies bridge-to-host services and all non-database port forwarding.
          sudo env RUNNER_TEMP="$RUNNER_TEMP" python3 scripts/restore_runner_network_guard.py apply \
            --docker-network "$RESTORE_DOCKER_NETWORK" \
            --database-container "$db_id" \
            --project-id "$RESTORE_PROJECT_ID" \
            --psql-image "$PSQL_IMAGE" \
            --marker "$RUNNER_TEMP/restore-runner-network-guard.json"
          python3 - <<'PY'
          import socket
          try:
              socket.create_connection(('::1', 54322), timeout=2).close()
          except OSError:
              pass
          else:
              raise SystemExit('Restore port is reachable over IPv6 loopback')
          PY
          if "${network_client[@]}" sh -c 'nc -z -w 4 1.1.1.1 443' >/dev/null 2>&1 || \
             "${network_client[@]}" sh -c 'nc -z -w 4 2606:4700:4700::1111 443' >/dev/null 2>&1; then
            echo "::error::Restore client network permits outbound connectivity"
            exit 1
          fi
          server_probe=(docker run --rm --network "container:$db_id" --entrypoint sh "$PSQL_IMAGE")
          if "${server_probe[@]}" -c 'nc -z -w 4 1.1.1.1 443' >/dev/null 2>&1 || \
             "${server_probe[@]}" -c 'nc -z -w 4 2606:4700:4700::1111 443' >/dev/null 2>&1; then
            echo "::error::Restore database network permits outbound connectivity"
            exit 1
          fi
          host_egress="$(python3 -c '
          import socket
          try:
              with socket.create_connection(("1.1.1.1", 443), timeout=3):
                  print("reachable")
          except OSError:
              print("blocked")
          ')"
          host_dns="$(python3 -c '
          import socket
          try:
              socket.getaddrinfo("example.com", 443)
              print("resolved")
          except OSError:
              print("unresolved")
          ')"
          printf 'runner-host-connectivity tcp=%s dns=%s (separate from container isolation)\n' "$host_egress" "$host_dns"
          echo 'Disposable PostgreSQL 17 target is runner-ingress-guarded and container-egress-isolated.'

      - name: Download selected private R2 backup and evidence
        shell: bash
        env:
          R2_RESTORE_ENDPOINT: ${{ secrets.R2_RESTORE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RESTORE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RESTORE_SECRET_ACCESS_KEY }}
          RESTORE_CANDIDATES_JSON: ${{ secrets.RESTORE_CANDIDATES_JSON }}
          R2_BUCKET: moris-mix-db-backups-prod
        run: |
          set -euo pipefail
          umask 077
          for key in R2_RESTORE_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing isolated restore credential $key"
              exit 1
            fi
          done
          if [[ ! "$R2_RESTORE_ENDPOINT" =~ ^https://[^/]+\.r2\.cloudflarestorage\.com/?$ ]]; then
            echo "::error::Invalid R2 restore endpoint"
            exit 1
          fi
          python3 scripts/restore_candidate_manifest.py \
            "$RESTORE_CANDIDATE" "$RUNNER_TEMP/restore-candidate.env"
          source "$RUNNER_TEMP/restore-candidate.env"
          for value in "$BACKUP_PREFIX" "$ARCHIVE_NAME" "$EVIDENCE_NAME" \
                       "$BACKUP_SHA256" "$BACKUP_SIZE" "$BACKUP_RUN_ID" \
                       "$BACKUP_ATTEMPT" "$BACKUP_SOURCE_SHA" "$BACKUP_SOURCE_PROJECT"; do
            printf '::add-mask::%s\n' "$value"
          done
          if aws s3 cp "s3://${R2_BUCKET}/${BACKUP_PREFIX}/${ARCHIVE_NAME}" \
            "$RUNNER_TEMP/restore-selected.tar.gz" \
            --endpoint-url "$R2_RESTORE_ENDPOINT" --only-show-errors --no-progress \
            > "$RUNNER_TEMP/restore-download-archive.log" 2>&1; then
            :
          else
            rc=$?
            echo "::error::Private archive download failed"
            exit "$rc"
          fi
          if aws s3 cp "s3://${R2_BUCKET}/${BACKUP_PREFIX}/${EVIDENCE_NAME}" \
            "$RUNNER_TEMP/restore-selected.json" \
            --endpoint-url "$R2_RESTORE_ENDPOINT" --only-show-errors --no-progress \
            > "$RUNNER_TEMP/restore-download-evidence.log" 2>&1; then
            :
          else
            rc=$?
            echo "::error::Private evidence download failed"
            exit "$rc"
          fi

      - name: Verify selected archive, source identity, and component checksums
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source "$RUNNER_TEMP/restore-candidate.env"
          python3 - "$RUNNER_TEMP/restore-selected.tar.gz" \
            "$RUNNER_TEMP/restore-selected.json" "$RUNNER_TEMP/restore-verified-sql" <<'PY'
          import hashlib, json, os, pathlib, re, sys, tarfile
          arc, ev, target = map(pathlib.Path, sys.argv[1:])
          members = {'roles.sql','schema.sql','data.sql','history-schema.sql',
                     'history-data.sql','component-checksums.sha256','backup-metadata.json'}
          components = members - {'component-checksums.sha256','backup-metadata.json'}
          def require(check, reason):
              if not check: raise SystemExit('Private archive verification failed: '+reason)
          require(arc.stat().st_size == int(os.environ['BACKUP_SIZE']), 'size mismatch')
          require(hashlib.sha256(arc.read_bytes()).hexdigest()==os.environ['BACKUP_SHA256'],'SHA-256 mismatch')
          evidence=json.loads(ev.read_text())
          expected={'archive_sha256':os.environ['BACKUP_SHA256'],
                    'archive_size_bytes':int(os.environ['BACKUP_SIZE']),
                    'workflow_run_id':os.environ['BACKUP_RUN_ID'],
                    'workflow_run_attempt':os.environ['BACKUP_ATTEMPT'],
                    'source_revision':os.environ['BACKUP_SOURCE_SHA'],
                    'source_project_ref':os.environ['BACKUP_SOURCE_PROJECT'],
                    'source_repository':os.environ['GITHUB_REPOSITORY'],
                    'object_key':os.environ['BACKUP_PREFIX']+'/'+os.environ['ARCHIVE_NAME'],
                    'consistency_check':'passed'}
          for key,value in expected.items():
              require(str(evidence.get(key))==str(value),'evidence identity '+key)
          require(not target.exists(),'restore file directory already exists')
          with tarfile.open(arc,'r:gz') as bundle:
              selected={}
              for item in bundle.getmembers():
                  if item.isdir() and item.name in ('.','./'): continue
                  require(item.isfile() and item.name.startswith('./'),'unsafe archive entry')
                  name=item.name[2:]
                  require(name in members and name not in selected and 0<item.size<32*1024*1024,
                          'unexpected archive entry or size')
                  selected[name]=item
              require(set(selected)==members,'archive manifest')
              checks=bundle.extractfile(selected['component-checksums.sha256']).read().decode('ascii')
              hashes={}
              for line in checks.splitlines():
                  match=re.fullmatch(r'([0-9a-f]{64})  ([a-z-]+\.sql)',line)
                  require(match is not None,'invalid checksum line')
                  h,name=match.groups()
                  require(name in components and name not in hashes,'unexpected checksum entry')
                  hashes[name]=h
              require(set(hashes)==components,'missing checksums')
              metadata=json.loads(bundle.extractfile(selected['backup-metadata.json']).read())
              for key,value in {'source_revision':expected['source_revision'],
                                'source_project_ref':expected['source_project_ref'],
                                'workflow_run_id':expected['workflow_run_id'],
                                'workflow_run_attempt':expected['workflow_run_attempt'],
                                'generated_at_utc':evidence['generated_at_utc']}.items():
                  require(str(metadata.get(key))==str(value),'metadata identity '+key)
              verified={}
              for name in components:
                  source=bundle.extractfile(selected[name]).read()
                  require(hashlib.sha256(source).hexdigest()==hashes[name],'SQL checksum mismatch')
                  verified[name]=source
          target.mkdir(mode=0o700)
          for name,source in verified.items():
              with (target/name).open('xb') as out:
                  os.chmod(target/name,0o600)
                  out.write(source)
          print('Private archive, R2 evidence, and five SQL components verified.')
          PY

      - name: Restore SQL transactionally using patched PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          network_info="$(docker network inspect --format \
            '{{.Driver}}|{{.Internal}}|{{.EnableIPv6}}|{{index .Labels "com.supabase.cli.project"}}|{{index .Labels "com.docker.compose.project"}}' \
            "$RESTORE_DOCKER_NETWORK")"
          db_id="$(docker ps --filter "label=com.supabase.cli.project=$RESTORE_PROJECT_ID" --format '{{.ID}}')"
          attached_networks="$(docker inspect --format '{{range $name, $cfg := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' "$db_id")"
          if [[ "$network_info" != "bridge|true|false|$RESTORE_PROJECT_ID|$RESTORE_PROJECT_ID" || \
                "$attached_networks" != "$RESTORE_DOCKER_NETWORK" ]]; then
            echo "::error::Restore target network isolation check failed"
            exit 1
          fi
          # Ubuntu's psql may be version 16. A patched 17.11 client understands
          # the source dump's restrict/unrestrict guards without stripping them.
          # The container does not receive any R2 or production credentials.
          # Never echo private output. The bounded classifier emits fixed,
          # explicitly untrusted hints; final output has an independent allowlist.
          checked() {
            local phase="$1" rc category component_hint error_category_hint statement_class_hint diagnostic_details
            shift
            if "$@" > "$RUNNER_TEMP/private-restore-result.log" \
                2> "$RUNNER_TEMP/private-restore-stderr.log"; then
              printf 'Restore diagnostic: phase=%s status=passed\n' "$phase"
            else
              rc=$?
              case "$rc" in
                125|126|127) category=container-client ;;
                *)
                  case "$phase:$rc" in
                    client:1) category=container-client ;;
                    files:1) category=mounted-files ;;
                    connection:2|restore:2) category=connection ;;
                    restore:3) category=sql-script ;;
                    connection:1) category=client-fatal ;;
                    restore:1) category=client-or-sql-action ;;
                    *) category=unclassified ;;
                  esac ;;
              esac
              component_hint=unknown
              error_category_hint=unknown
              statement_class_hint=unknown
              if [[ "$phase:$rc" == restore:3 ]]; then
                diagnostic_details="$(python3 scripts/classify_restore_component.py --details \
                  "$RUNNER_TEMP/private-restore-stderr.log" "$rc" \
                  "$RUNNER_TEMP/restore-verified-sql/roles.sql" 2> /dev/null)" || diagnostic_details=
                if [[ "$diagnostic_details" =~ ^(roles[.]sql|schema[.]sql|history-schema[.]sql|data[.]sql|history-data[.]sql|unknown)\ ([a-z-]{1,32})\ (role-membership-grant|alter-role-set|create-role|alter-role-attributes|unknown)$ ]]; then
                  read -r component_hint error_category_hint statement_class_hint <<< "$diagnostic_details"
                fi
              fi
              case "$component_hint" in
                roles.sql|schema.sql|history-schema.sql|data.sql|history-data.sql|unknown) ;;
                *) component_hint=unknown ;;
              esac
              case "$component_hint:$error_category_hint" in
                *:unknown|roles.sql:insufficient-privilege|roles.sql:undefined-object|roles.sql:duplicate-object|\
                data.sql:bad-copy-file-format|data.sql:character-not-in-repertoire|\
                data.sql:invalid-text-representation|data.sql:string-data-right-truncation|\
                data.sql:numeric-value-out-of-range|data.sql:invalid-datetime-format|\
                data.sql:datetime-field-overflow|data.sql:not-null-violation|data.sql:foreign-key-violation|\
                data.sql:unique-violation|data.sql:check-violation|data.sql:exclusion-violation|\
                data.sql:insufficient-privilege|data.sql:undefined-column|data.sql:undefined-table) ;;
                *) error_category_hint=unknown ;;
              esac
              case "$component_hint:$statement_class_hint" in
                *:unknown|roles.sql:role-membership-grant|roles.sql:alter-role-set|\
                roles.sql:create-role|roles.sql:alter-role-attributes) ;;
                *) statement_class_hint=unknown ;;
              esac
              printf '::error::Restore diagnostic: phase=%s category=%s exit_code=%d component_hint=%s untrusted_error_category_hint=%s untrusted_statement_class_hint=%s; private output suppressed\n' \
                "$phase" "$category" "$rc" "$component_hint" "$error_category_hint" "$statement_class_hint"
              exit "$rc"
            fi
          }
          # Keep the same container identity, hardening, mount and local target
          # for every probe and the restore. No R2 credentials enter the client.
          client=(docker run --rm --network "$RESTORE_DOCKER_NETWORK" \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --mount "type=bind,source=$RUNNER_TEMP/restore-verified-sql,target=/backup,readonly" \
            "$PSQL_IMAGE")
          checked client "${client[@]}" psql --version
          checked files "${client[@]}" sh -c \
            'for file in /backup/roles.sql /backup/schema.sql /backup/history-schema.sql /backup/data.sql /backup/history-data.sql; do test -f "$file" && test -r "$file" || exit 1; done'
          # Validate the local login inside the same transaction before any private SQL.
          restore_db='postgresql://supabase_admin:postgres@db:5432/postgres'
          require_admin="$(cat <<'SQL'
          DO $restore_identity$
          BEGIN
            IF current_user <> 'supabase_admin' OR session_user <> 'supabase_admin'
                OR NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = current_user AND rolsuper)
            THEN
              RAISE insufficient_privilege USING MESSAGE = 'Unexpected local restore identity';
            END IF;
          END;
          $restore_identity$;
          SQL
          )"
          checked connection "${client[@]}" \
            psql -X -q --no-password -v ON_ERROR_STOP=1 -c 'SELECT 1' -d "$restore_db"
          checked restore "${client[@]}" \
              psql -X -q --no-password --single-transaction -v ON_ERROR_STOP=1 \
              -v VERBOSITY=sqlstate -c "$require_admin" \
              -f /backup/roles.sql \
              -f /backup/schema.sql \
              -f /backup/history-schema.sql \
              -c 'SET session_replication_role = replica' \
              -f /backup/data.sql \
              -f /backup/history-data.sql -d "$restore_db"
          echo 'Transactional isolated SQL restore passed.'

      - name: Validate restored application counts, migration versions and foreign keys
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          network_info="$(docker network inspect --format \
            '{{.Driver}}|{{.Internal}}|{{.EnableIPv6}}|{{index .Labels "com.supabase.cli.project"}}|{{index .Labels "com.docker.compose.project"}}' \
            "$RESTORE_DOCKER_NETWORK")"
          db_id="$(docker ps --filter "label=com.supabase.cli.project=$RESTORE_PROJECT_ID" --format '{{.ID}}')"
          attached_networks="$(docker inspect --format '{{range $name, $cfg := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' "$db_id")"
          if [[ "$network_info" != "bridge|true|false|$RESTORE_PROJECT_ID|$RESTORE_PROJECT_ID" || \
                "$attached_networks" != "$RESTORE_DOCKER_NETWORK" ]]; then
            echo "::error::Restore target network isolation check failed"
            exit 1
          fi
          query="SELECT (SELECT count(*) FROM public.profiles),
            (SELECT count(*) FROM public.recipes),
            (SELECT count(*) FROM public.recipe_lineage),
            (SELECT count(*) FROM public.ai_usage_daily),
            (SELECT count(*) FROM public.ai_quota_reservations),
            (SELECT count(*) FROM supabase_migrations.schema_migrations),
            (SELECT md5(string_agg(version::text, ',' ORDER BY version::text))
              FROM supabase_migrations.schema_migrations);"
          if ! aggregates="$(docker run --rm --network "$RESTORE_DOCKER_NETWORK" \
              --user "$(id -u):$(id -g)" --cap-drop ALL \
              --security-opt no-new-privileges --read-only \
              "$PSQL_IMAGE" \
                psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "$query" \
                -d 'postgresql://postgres:postgres@db:5432/postgres' \
              2> "$RUNNER_TEMP/private-verify-result.log")"; then
            echo "::error::Database aggregate verification query failed"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/restore-verified-sql/data.sql" \
            "$RUNNER_TEMP/restore-verified-sql/history-data.sql" "$aggregates" <<'PY'
          import hashlib, pathlib, re, sys
          tables=['public.profiles','public.recipes','public.recipe_lineage',
                  'public.ai_usage_daily','public.ai_quota_reservations']
          ledger='supabase_migrations.schema_migrations'
          def counts(path):
              result={name:0 for name in tables+[ledger]}
              versions=[]
              active=None
              version_index=None
              # PostgreSQL COPY rows end at LF, not Unicode line separators.
              # splitlines() would overcount rows containing U+2028/U+2029.
              for line in pathlib.Path(path).read_text(encoding='utf-8').split('\n'):
                  if active is not None:
                      if line==r'\.': active=None; continue
                      if active in result: result[active]+=1
                      if active==ledger:
                          fields=line.split('\t')
                          if version_index is None or version_index>=len(fields) or not re.fullmatch(r'[0-9]{14}',fields[version_index]):
                              raise SystemExit('Invalid migration history version')
                          versions.append(fields[version_index])
                      continue
                  if line.startswith('COPY '):
                      # pg_dump may quote either or both schema/table identifiers.
                      # Match paired quotes, not arbitrary SQL names or expressions.
                      identifier=r'(?:"([a-z0-9_]+)"|([a-z0-9_]+))'
                      match=re.fullmatch(
                          r'COPY '+identifier+r'\.'+identifier+r' \(([^)]*)\) FROM stdin;',line)
                      if match is None: raise SystemExit('Unsupported COPY format')
                      schema=match.group(1) or match.group(2)
                      table=match.group(3) or match.group(4)
                      active=f'{schema}.{table}'
                      if active==ledger:
                          columns=[x.strip(' "') for x in match.group(5).split(',')]
                          if 'version' not in columns: raise SystemExit('Migration version column missing')
                          version_index=columns.index('version')
              if active is not None: raise SystemExit('Unterminated COPY block')
              return result,versions
          data,_=counts(sys.argv[1])
          history,versions=counts(sys.argv[2])
          fields=sys.argv[3].strip().split('|')
          if len(fields)!=7 or not all(re.fullmatch(r'[0-9]+',s) for s in fields[:6]):
              raise SystemExit('Invalid aggregate result')
          expected=[data[name] for name in tables]+[history[ledger]]
          if [int(s) for s in fields[:6]]!=expected:
              raise SystemExit('Restored row counts do not match backup')
          digest=hashlib.md5(','.join(sorted(versions)).encode()).hexdigest()
          if digest!=fields[6] or len(set(versions))!=len(versions):
              raise SystemExit('Restored migration version set does not match backup')
          print('Five application table counts and the migration version set match the backup.')
          PY
          if ! integrity_query="$(cat scripts/verify_restore_foreign_keys.sql 2>/dev/null)" ||
              [[ -z "$integrity_query" ]]; then
            echo "::error::Application foreign-key verification query is unavailable"
            exit 1
          fi
          if ! integrity_result="$(docker run --rm --network host \
              --user "$(id -u):$(id -g)" --cap-drop ALL \
              --security-opt no-new-privileges --read-only \
              "$PSQL_IMAGE" \
                psql -X -q -A -t -v ON_ERROR_STOP=1 -c "$integrity_query" \
                -d 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
              2>/dev/null)"; then
            echo "::error::Application foreign-key verification query failed"
            exit 1
          fi
          if [[ "$integrity_result" != "1" ]]; then
            echo "::error::Application foreign-key integrity verification failed"
            exit 1
          fi
          echo 'Seven application foreign-key mappings and references verified.'
          echo 'Managed-schema, Storage object and provider-settings recovery are not claimed.'

      - name: Record safe restore result
        shell: bash
        run: |
          {
            echo '### Database Restore Drill — Stage B'
            echo '- Approved recovery candidate identity: withheld from public output'
            echo '- Target: disposable PostgreSQL 17; private data is introduced after the internal network and runner-ingress guard pass'
            echo '- Runner-host outbound TCP/DNS: observed separately and not restricted by this workflow'
            echo '- R2 byte-integrity, metadata, component checksums: passed'
            echo '- Transactional SQL restore: passed'
            echo '- Application counts and migration history: passed'
            echo '- Application foreign-key integrity: passed'
            echo '- Excluded: Storage object bytes, platform secrets/settings, unverified managed schemas'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop isolated database and delete private files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failure=0
          workdir="$RUNNER_TEMP/moris-restore-local"
          if [[ -f "$workdir/supabase/config.toml" ]]; then
            supabase stop --workdir "$workdir" --no-backup \
              > /dev/null 2>&1 || failure=1
          fi
          if ! rm -rf "$RUNNER_TEMP/restore-verified-sql" "$RUNNER_TEMP/restore-selected.tar.gz" \
            "$RUNNER_TEMP/restore-selected.json" "$RUNNER_TEMP/private-restore-result.log" \
            "$RUNNER_TEMP/private-restore-stderr.log" \
            "$RUNNER_TEMP/private-verify-result.log" "$RUNNER_TEMP/private-db-start.log" \
            "$RUNNER_TEMP/restore-download-archive.log" "$RUNNER_TEMP/restore-download-evidence.log" \
            "$RUNNER_TEMP/restore-candidate.env" "$workdir"; then
            failure=1
          fi
          if network_list="$(docker network ls --format '{{.Name}}' 2>/dev/null)"; then
            network_exists=0
            network_owned=0
            if [[ -f "$RUNNER_TEMP/restore-network-owned" && ! -L "$RUNNER_TEMP/restore-network-owned" ]] && \
               [[ "$(cat "$RUNNER_TEMP/restore-network-owned")" == "$RESTORE_DOCKER_NETWORK" ]]; then
              network_owned=1
            fi
            while IFS= read -r network_name; do
              if [[ "$network_name" == "$RESTORE_DOCKER_NETWORK" ]]; then
                network_exists=1
                break
              fi
            done <<< "$network_list"
            if [[ "$network_exists" == 1 ]]; then
              if [[ "$network_owned" == 1 ]]; then
                docker network rm "$RESTORE_DOCKER_NETWORK" >/dev/null 2>&1 || failure=1
              else
                failure=1
              fi
            fi
          else
            failure=1
          fi
          if [[ "$failure" -eq 0 && -e "$RUNNER_TEMP/restore-network-owned" ]]; then
            rm -f "$RUNNER_TEMP/restore-network-owned" || failure=1
          fi
          if [[ "$failure" -eq 0 && -e "$RUNNER_TEMP/restore-runner-network-guard.json" ]]; then
            sudo env RUNNER_TEMP="$RUNNER_TEMP" python3 scripts/restore_runner_network_guard.py remove \
              --docker-network "$RESTORE_DOCKER_NETWORK" \
              --marker "$RUNNER_TEMP/restore-runner-network-guard.json" || failure=1
          fi
          if ! remaining_containers="$(docker ps -aq --filter "label=com.supabase.cli.project=$RESTORE_PROJECT_ID" 2>/dev/null)" || \
             ! remaining_volumes="$(docker volume ls -q --filter "label=com.supabase.cli.project=$RESTORE_PROJECT_ID" 2>/dev/null)" || \
             ! remaining_networks="$(docker network ls -q --filter "label=com.supabase.cli.project=$RESTORE_PROJECT_ID" 2>/dev/null)"; then
            failure=1
          elif [[ -n "$remaining_containers" || -n "$remaining_volumes" || -n "$remaining_networks" ]]; then
            echo '::error::Disposable PostgreSQL containers, volumes, or networks remain after cleanup'
            failure=1
          fi
          if [[ "$failure" -ne 0 ]]; then
            echo '::error::Restore cleanup could not be confirmed; runner teardown will recycle the VM'
            exit 1
          fi
          echo 'Isolated database, volumes, network guard, and private runner files cleaned.'
