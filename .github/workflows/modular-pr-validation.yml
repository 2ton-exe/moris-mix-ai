name: Modular PR Validation

# PR validation; staging and production delivery are disabled for PRs.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Explicit least-privilege GITHUB_TOKEN baseline for PR validation.
# Called reusable workflows cannot elevate token permissions above the caller;
# caller jobs may declare justified job-specific scopes where allowed.
permissions:
  contents: read

jobs:
  classify:
    name: Classify PR paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      e2e: ${{ steps.classify.outputs.e2e }}
      staging: ${{ steps.classify.outputs.staging }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout real PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Classify complete PR diff
        id: classify
        run: node scripts/ci-path-classifier.mjs
      # The Jobs API exposes step conclusions, but not classifier outputs.
      - name: Record documentation-only E2E/staging skips
        if: steps.classify.outputs.docs_only == 'true' && steps.classify.outputs.e2e == 'skip' && steps.classify.outputs.staging == 'skip'
        run: echo "Verified documentation-only decision; E2E and staging will not execute."
      - name: Record intentionally disabled PR staging
        run: echo "Staging deploy and smoke are intentionally disabled for pull requests."

  frontend:
    name: Modular Frontend
    needs: classify
    # A failed/missing classifier must run full validation, not skip this context.
    if: ${{ !cancelled() }}
    with:
      docs-only: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
    uses: ./.github/workflows/reusable-frontend.yml

  test-db:
    name: Modular Database
    needs: classify
    # A failed/missing classifier must run full validation, not skip this context.
    if: ${{ !cancelled() }}
    with:
      docs-only: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
    uses: ./.github/workflows/reusable-database.yml

  test-edge-api:
    name: Modular Edge/API
    needs: classify
    # A failed/missing classifier must run full validation, not skip this context.
    if: ${{ !cancelled() }}
    with:
      docs-only: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
    uses: ./.github/workflows/reusable-edge-api.yml
    # PRs receive no hosted credentials. Database and E2E jobs use local services.

  staging:
    name: Modular Staging
    # Keep the existing check visible as skipped; PR validation cannot deploy.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR staging deployment is disabled."

  test-e2e:
    name: Modular E2E
    needs: classify
    if: ${{ !cancelled() && !(needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' && needs.classify.outputs.e2e == 'skip') }}
    uses: ./.github/workflows/reusable-e2e.yml
