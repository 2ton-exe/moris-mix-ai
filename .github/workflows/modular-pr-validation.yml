name: Modular PR Validation

# Stage 1 comparison runs only. ci.yml remains authoritative for required
# checks and is the sole production deployment entry point.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  frontend:
    name: Modular Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  test-db:
    name: Modular Database
    uses: ./.github/workflows/reusable-database.yml

  test-edge-api:
    name: Modular Edge/API
    uses: ./.github/workflows/reusable-edge-api.yml
    secrets:
      BE04_RLS_TEST_SUPABASE_URL: ${{ secrets.BE04_RLS_TEST_SUPABASE_URL }}
      BE04_RLS_TEST_SUPABASE_ANON_KEY: ${{ secrets.BE04_RLS_TEST_SUPABASE_ANON_KEY }}
      BE04_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BE04_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      BE04_RLS_TEST_SUPABASE_SECRET_KEY: ${{ secrets.BE04_RLS_TEST_SUPABASE_SECRET_KEY }}
      BE04_RLS_TEST_EXPECTED_PROJECT_REF: ${{ secrets.BE04_RLS_TEST_EXPECTED_PROJECT_REF || secrets.BE04_RLS_TEST_PROJECT_REF }}
      BE04_RLS_TEST_DATABASE_URL: ${{ secrets.BE04_RLS_TEST_DATABASE_URL }}

  staging:
    name: Modular Staging
    needs:
      - frontend
      - test-db
      - test-edge-api

    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )

    uses: ./.github/workflows/reusable-staging.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
