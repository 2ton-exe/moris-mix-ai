name: Reusable Production Release

on:
  workflow_call:
    inputs:
      frontend-exists:
        description: Frontend existence only; caller must gate on successful validations
        required: true
        type: boolean
      verified-production-origin:
        description: Production origin verified by same-run image readiness
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Supabase and Cloudflare
    if: >-
      success() && inputs.frontend-exists &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/modular-main.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-latest
    environment: production-release

    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
      queue: max

    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_RECIPE_IMAGES: ${{ vars.VITE_RECIPE_IMAGES == 'true' && 'true' || 'false' }}
      VITE_RECIPE_IMAGE_UPLOAD_IDEMPOTENCY: ${{ vars.VITE_RECIPE_IMAGE_UPLOAD_IDEMPOTENCY || 'false' }}
      SMOKE_ENVIRONMENT: production
      SMOKE_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      SMOKE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SMOKE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SMOKE_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      SMOKE_BACKEND_REVISION: ${{ vars.PRODUCTION_DEMO_RECIPE_REVISION }}

    steps:
      - name: Validate production release credentials
        shell: bash
        env:
          PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_RELEASE_CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_RELEASE_CLOUDFLARE_API_TOKEN }}
          PRODUCTION_RELEASE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_RELEASE_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          required_secrets=(
            PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN
            PRODUCTION_RELEASE_CLOUDFLARE_API_TOKEN
            PRODUCTION_RELEASE_CLOUDFLARE_ACCOUNT_ID
          )
          for name in "${required_secrets[@]}"; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Configure the ${name} secret in the production-release environment."
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate production deployment configuration
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          if [[ -z "${VITE_SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the VITE_SUPABASE_URL repository variable."
            exit 1
          fi
          public_key="${VITE_SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [[ -z "${public_key//[[:space:]]/}" ]]; then
            echo "::error::Configure the VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY repository variable."
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF//[[:space:]]/}" ]]; then
            echo "::error::Configure the SUPABASE_PROJECT_REF repository variable."
            exit 1
          fi
          vite_supabase_url="${VITE_SUPABASE_URL%/}"
          if [[ "$vite_supabase_url" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo "::error::VITE_SUPABASE_URL must target the SUPABASE_PROJECT_REF project."
            exit 1
          fi
          config_project_ref="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)"
          if [[ "$SUPABASE_PROJECT_REF" != "$config_project_ref" ]]; then
            echo "::error::SUPABASE_PROJECT_REF must match project_id in supabase/config.toml."
            exit 1
          fi

          node --input-type=module -e 'import { configuration } from "./scripts/runtime-smoke.mjs"; configuration(process.env);'

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Reject stale production revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Current main is ${current_sha}; refusing to deploy stale revision ${GITHUB_SHA}."
            exit 1
          fi

      - name: Verify recipe image release prerequisites
        if: env.VITE_RECIPE_IMAGES == 'true' || vars.RECIPE_IMAGE_CLEANUP_ENABLED == 'true'
        env:
          RECIPE_IMAGE_CLEANUP_ENABLED: ${{ vars.RECIPE_IMAGE_CLEANUP_ENABLED == 'true' && 'true' || 'false' }}
          PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
          VERIFIED_PRODUCTION_ORIGIN: ${{ inputs.verified-production-origin }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VITE_RECIPE_IMAGES" == true && "$RECIPE_IMAGE_CLEANUP_ENABLED" != true ]]; then
            echo "::error::Enable and verify staging cleanup before enabling recipe images. See docs/devops/deployment-runbook.md."
            exit 1
          fi
          if [[ "$VITE_RECIPE_IMAGES" == true ]]; then
            if ! node --input-type=module -e '
              const origin = value => {
                try {
                  const url = new URL(value);
                  return url.protocol === "https:" ? url.origin : "";
                } catch { return ""; }
              };
              const verified = origin(process.env.VERIFIED_PRODUCTION_ORIGIN);
              const release = origin(process.env.PRODUCTION_FRONTEND_URL);
              if (!verified || verified !== release) process.exitCode = 1;
            '; then
              echo "::error::Same-run image readiness origin does not match PRODUCTION_FRONTEND_URL."
              exit 1
            fi
          fi
          migrations="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/migrations")"
          for path in supabase/migrations/*_recipe_image_*.sql supabase/migrations/20261115000022_*.sql; do
            version="${path##*/}"
            version="${version%%_*}"
            if ! jq -e --arg version "$version" 'any(.[]; .version == $version)' <<< "$migrations" >/dev/null 2>&1; then
              echo "::error::Could not verify required migration ${version}. Use the guarded database release before deploying recipe images."
              exit 1
            fi
          done

      - name: Deploy recipes Edge Function
        id: deploy-recipes
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy recipes \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy account-export Edge Function
        id: deploy-account-export
        # Keep the capacity-gated BE-16 endpoint off production until its acceptance gates pass.
        if: false
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy account-export \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy extract-recipe Edge Function
        id: deploy-extract-recipe
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy extract-recipe \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy generate-recipe Edge Function
        id: deploy-generate-recipe
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy generate-recipe \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy recipe-image-attach Edge Function
        id: deploy-recipe-image-attach
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy recipe-image-attach \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy recipe-image-download-url Edge Function
        id: deploy-recipe-image-download-url
        if: env.VITE_RECIPE_IMAGES == 'true'
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy recipe-image-download-url \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy recipe image upload cleanup Edge Function
        id: deploy-recipe-image-cleanup
        if: vars.RECIPE_IMAGE_CLEANUP_ENABLED == 'true'
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy recipe-image-upload-cleanup \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy recipe-image-upload-url Edge Function
        id: deploy-recipe-image-upload-url
        if: env.VITE_RECIPE_IMAGES == 'true'
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_RELEASE_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy recipe-image-upload-url \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Deploy to Cloudflare Workers
        id: deploy-cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.PRODUCTION_RELEASE_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.PRODUCTION_RELEASE_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Verify production deployment URL
        id: verify-deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-cloudflare.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          if ! node --input-type=module -e '
            const origin = value => {
              try {
                const url = new URL(value);
                return url.protocol === "https:" && !url.username && !url.password &&
                  url.pathname === "/" && !url.search && !url.hash ? url.origin : "";
              } catch { return ""; }
            };
            const deployment = origin(process.env.DEPLOYMENT_URL);
            const configured = origin(process.env.SMOKE_FRONTEND_URL);
            if (!deployment || deployment !== configured) process.exitCode = 1;
          '; then
            echo "::error::Wrangler deployment URL does not match PRODUCTION_FRONTEND_URL."
            exit 1
          fi

      - name: Verify deployed AI routes
        id: ai-route-smoke
        env:
          AI_ROUTE_SMOKE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          AI_ROUTE_SMOKE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          AI_ROUTE_SMOKE_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
        run: node scripts/ai-route-smoke.mjs

      # Kept inside the deployment job so cloudflare-production covers smoke too.
      # Normal success semantics ensure no runtime smoke after a failed deploy.
      - name: Production runtime smoke
        id: runtime-smoke
        env:
          SMOKE_DEPLOYMENT_OUTCOME: ${{ steps.deploy-cloudflare.outcome }}
          SMOKE_ACCOUNT_EXPORT_OUTCOME: ${{ steps.deploy-account-export.outcome }}
        run: node scripts/runtime-smoke.mjs

      - name: Record production deployment and runtime outcomes
        if: always()
        env:
          RECIPES_OUTCOME: ${{ steps.deploy-recipes.outcome }}
          ACCOUNT_EXPORT_OUTCOME: ${{ steps.deploy-account-export.outcome }}
          IMAGE_ATTACH_OUTCOME: ${{ steps.deploy-recipe-image-attach.outcome }}
          IMAGE_DOWNLOAD_OUTCOME: ${{ steps.deploy-recipe-image-download-url.outcome }}
          IMAGE_CLEANUP_OUTCOME: ${{ steps.deploy-recipe-image-cleanup.outcome }}
          IMAGE_SIGNER_OUTCOME: ${{ steps.deploy-recipe-image-upload-url.outcome }}
          EXTRACT_RECIPE_OUTCOME: ${{ steps.deploy-extract-recipe.outcome }}
          GENERATE_RECIPE_OUTCOME: ${{ steps.deploy-generate-recipe.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.deploy-cloudflare.outcome }}
          URL_OUTCOME: ${{ steps.verify-deployment.outcome }}
          AI_ROUTE_SMOKE_OUTCOME: ${{ steps.ai-route-smoke.outcome }}
          SMOKE_OUTCOME: ${{ steps.runtime-smoke.outcome }}
        shell: bash
        run: |
          {
            echo "### Production delivery"
            echo "- Source revision: ${GITHUB_SHA}"
            echo "- recipes deployment command: ${RECIPES_OUTCOME}"
            echo "- account-export deployment command: ${ACCOUNT_EXPORT_OUTCOME}"
            echo "- recipe image attachment deployment command: ${IMAGE_ATTACH_OUTCOME}"
            echo "- recipe image private download deployment command: ${IMAGE_DOWNLOAD_OUTCOME}"
            echo "- recipe image cleanup deployment command: ${IMAGE_CLEANUP_OUTCOME}"
            echo "- recipe image signer deployment command: ${IMAGE_SIGNER_OUTCOME}"
            echo "- extract-recipe deployment command: ${EXTRACT_RECIPE_OUTCOME}"
            echo "- generate-recipe deployment command: ${GENERATE_RECIPE_OUTCOME}"
            echo "- Cloudflare deployment command: ${CLOUDFLARE_OUTCOME}"
            echo "- Deployment URL verification: ${URL_OUTCOME}"
            echo "- AI route smoke: ${AI_ROUTE_SMOKE_OUTCOME}"
            echo "- Runtime smoke: ${SMOKE_OUTCOME}"
            echo "- demo-recipe is operator-managed; source attestation is in runtime smoke evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve production runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-smoke.json
          if-no-files-found: warn

      - name: Preserve production AI route evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-ai-route-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai-route-smoke.json
          if-no-files-found: warn
