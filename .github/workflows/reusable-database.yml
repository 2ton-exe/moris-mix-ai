name: Reusable Database Validation

on:
  workflow_call:
    inputs:
      docs-only:
        description: Verified Stage A prose-only PR; never applies to main
        type: boolean
        default: false

jobs:
  test-db:
    name: Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOCS_ONLY: ${{ inputs.docs-only && github.event_name == 'pull_request' }}
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      RUN_MIGRATION_DB_TESTS: "true"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: env.DOCS_ONLY != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: env.DOCS_ONLY != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        if: env.DOCS_ONLY != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL readiness
        if: env.DOCS_ONLY != 'true'
        run: |
          node -e "
            import('pg').then(async ({ Client }) => {
              const url = process.env.DATABASE_URL;
              for (let i = 0; i < 30; i++) {
                try {
                  const client = new Client({ connectionString: url, ssl: false, connectionTimeoutMillis: 2000 });
                  await client.connect();
                  await client.query('SELECT 1;');
                  await client.end();
                  console.log('PostgreSQL service container is ready and accepting connections.');
                  return;
                } catch (err) {
                  await new Promise((r) => setTimeout(r, 1000));
                }
              }
              console.error('Timed out waiting for PostgreSQL service container.');
              process.exit(1);
            });
          "

      - name: Run database migrations
        if: env.DOCS_ONLY != 'true'
        run: pnpm run db:setup

      - name: Run migration tests
        if: env.DOCS_ONLY != 'true'
        run: pnpm run test:lifecycle

      - name: Run RLS tests
        if: env.DOCS_ONLY != 'true'
        run: pnpm test:db

      - name: Record documentation-only validation path
        if: env.DOCS_ONLY == 'true'
        run: echo "Verified documentation-only PR - expensive application validation is not required in this context."
