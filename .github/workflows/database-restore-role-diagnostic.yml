name: Database Restore Role Diagnostic

# No PR, push, or scheduled access to the selected production backup.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-restore:
    name: Diagnose verified roles.sql in disposable PostgreSQL 17
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: database-restore-drill
    concurrency:
      group: database-restore-drill
      cancel-in-progress: false
    env:
      # Official postgres:17.11-alpine multi-platform index (Docker Library).
      # Immutable client code is important because this container reads private SQL.
      PSQL_IMAGE: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      R2_BUCKET: moris-mix-db-backups-prod
      BACKUP_PREFIX: postgres/2026/11/06/20261106T134224Z-f051d52f8c7b-42227611036-1
      ARCHIVE_NAME: moris-mix-postgres-20261106T134224Z-f051d52f8c7b-42227611036-1.tar.gz
      EVIDENCE_NAME: moris-mix-postgres-20261106T134224Z-f051d52f8c7b-42227611036-1.json
      BACKUP_SHA256: 7e62664f44c13dccc1a8c924712ff7baadaeb8e58b5e4a6563d41e2ed5e45a3f
      BACKUP_SIZE: "16814"
      BACKUP_RUN_ID: "42227611036"
      BACKUP_ATTEMPT: "1"
      BACKUP_SOURCE_SHA: f051d52f8c7b19a4f837794b1d26720dc78219ae
      BACKUP_SOURCE_PROJECT: gtbwblxskctpsqhbpebg
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout reviewed restore workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Download selected private R2 backup and evidence
        shell: bash
        env:
          R2_RESTORE_ENDPOINT: ${{ secrets.R2_RESTORE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RESTORE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RESTORE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/restore-private"
          install -d -m 700 "$private"
          for key in R2_RESTORE_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing isolated restore credential $key"
              exit 1
            fi
          done
          if [[ ! "$R2_RESTORE_ENDPOINT" =~ ^https://[^/]+\.r2\.cloudflarestorage\.com/?$ ]]; then
            echo "::error::Invalid R2 restore endpoint"
            exit 1
          fi
          aws s3 cp "s3://${R2_BUCKET}/${BACKUP_PREFIX}/${ARCHIVE_NAME}" \
            "$private/restore-selected.tar.gz" \
            --endpoint-url "$R2_RESTORE_ENDPOINT" --only-show-errors --no-progress
          aws s3 cp "s3://${R2_BUCKET}/${BACKUP_PREFIX}/${EVIDENCE_NAME}" \
            "$private/restore-selected.json" \
            --endpoint-url "$R2_RESTORE_ENDPOINT" --only-show-errors --no-progress

      - name: Verify selected archive, source identity, and component checksums
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/restore-private"
          python3 scripts/verify_restore_archive.py \
            --archive "$private/restore-selected.tar.gz" \
            --evidence "$private/restore-selected.json" \
            --target "$private/restore-verified-sql"

      - name: Start clean, isolated Supabase PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/restore-private"
          workdir="$private/moris-restore-local"
          supabase init --workdir "$workdir"
          python3 - "$workdir/supabase/config.toml" <<'PY'
          from pathlib import Path
          import re, sys, tomllib
          path=Path(sys.argv[1])
          original=path.read_text(encoding='utf-8')
          updated,count=re.subn(
              r'(?m)^([ \t]*major_version[ \t]*=[ \t]*)(?:"[0-9]+"|[0-9]+)([ \t]*(?:#.*)?)$',
              r'\g<1>17\2',original)
          if count!=1 or tomllib.loads(updated)['db']['major_version']!=17:
              raise SystemExit('Disposable PostgreSQL 17 configuration failed')
          path.write_text(updated,encoding='utf-8')
          PY
          supabase db start --workdir "$workdir"
          local_db='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          major="$(psql "$local_db" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT current_setting('server_version_num')::integer / 10000")"
          [[ "$major" == "17" ]] || { echo "::error::Unexpected PostgreSQL version"; exit 1; }
          fresh="$(psql "$local_db" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT (to_regclass('public.recipes') IS NULL AND to_regclass('public.profiles') IS NULL AND to_regclass('auth.users') IS NOT NULL)::int")"
          [[ "$fresh" == "1" ]] || { echo "::error::Target is not a clean Supabase baseline"; exit 1; }

      - name: Record bounded role patterns and replay diagnostics
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/restore-private"
          # The verified SQL, raw diagnostics and PostgreSQL output stay in
          # private 0600 files. Never capture untrusted stdout in shell variables:
          # Bash strips NUL bytes and trailing newlines before regex validation.
          roles="$private/restore-verified-sql/roles.sql"
          schema="$private/restore-verified-sql/schema.sql"
          if ! python3 scripts/restore_role_probe.py counts "$roles" "$schema" \
              > "$private/private-probe-counts.out" \
              2> "$private/private-probe-counts.err"; then
            # Static counts are optional, never a prerequisite for SQL replay.
            printf 'counts=unavailable\n' > "$private/private-probe-counts.out"
          fi

          # The same pinned client image, flags, container hardening, verified
          # readonly mount and local target used for Stage B's roles.sql.
          psql_client() {
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              --cap-drop ALL --security-opt no-new-privileges --read-only \
              --mount "type=bind,source=$private/restore-verified-sql,target=/backup,readonly" \
              "$PSQL_IMAGE" psql "$@"
          }
          restore_db='postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres'
          require_admin="$(cat <<'SQL'
          DO $restore_identity$
          BEGIN
            IF current_user <> 'supabase_admin' OR session_user <> 'supabase_admin'
                OR NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = current_user AND rolsuper)
            THEN
              RAISE insufficient_privilege USING MESSAGE = 'Unexpected local restore identity';
            END IF;
          END;
          $restore_identity$;
          SQL
          )"
          if ! psql_client -X -q -A -t -F '|' --no-password -v ON_ERROR_STOP=1 \
              -c "$require_admin" \
              -c "SELECT rolsuper::int,rolcreaterole::int,rolcreatedb::int,rolbypassrls::int,rolinherit::int FROM pg_catalog.pg_roles WHERE rolname=current_user" \
              -d "$restore_db" \
              > "$private/private-probe-flags.out" \
              2> "$private/private-role-flags-stderr.log"; then
            echo "::error::Local role attribute probe failed"
            exit 1
          fi

          # Identical Stage B psql version, replay flags, exact verified source
          # and target. Only the roles component runs; this is not a full restore.
          if psql_client -X -q --no-password --single-transaction -v ON_ERROR_STOP=1 \
              -v VERBOSITY=sqlstate -c "$require_admin" -f /backup/roles.sql -d "$restore_db" \
              > "$private/private-restore-result.log" \
              2> "$private/private-restore-stderr.log"; then
            rc=0
          else
            rc=$?
          fi
          if [[ "$rc" != 0 && "$rc" != 3 ]]; then
            echo "::error::Unexpected role-only replay execution failure"
            exit 1
          fi
          if ! python3 scripts/restore_role_probe.py result \
              "$private/private-restore-stderr.log" "$roles" "$rc" \
              > "$private/private-probe-result.out" \
              2> "$private/private-probe-result.err"; then
            echo "::error::Private role error probe unavailable"
            exit 1
          fi

          # One Python process checks exact raw bytes including NUL and terminal
          # newlines; also binds result labels to psql's actual exit code.
          # It reconstructs only allowlisted values for stdout and summary.
          if ! python3 scripts/restore_role_probe.py publish \
              "$private/private-probe-counts.out" \
              "$private/private-probe-flags.out" \
              "$private/private-probe-result.out" "$rc" \
              "$GITHUB_STEP_SUMMARY"; then
            echo "::error::Public diagnostic validation failed"
            exit 1
          fi
          if [[ "$rc" == 3 ]]; then
            echo "::error::Role-only SQL replay failed (diagnostic recorded; not recovery)"
            exit 1
          fi

      - name: Stop isolated database and delete private files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failure=0
          private="$RUNNER_TEMP/restore-private"
          workdir="$private/moris-restore-local"
          if [[ -f "$workdir/supabase/config.toml" ]]; then
            supabase stop --workdir "$workdir" --no-backup \
              > /dev/null 2>&1 || failure=1
          fi
          # The single owner-only temp root contains all archive and diagnostic files.
          if [[ -e "$private" ]]; then
            rm -rf "$private" > /dev/null 2>&1 || failure=1
          fi
          if [[ "$failure" -ne 0 ]]; then
            echo '::error::Local cleanup incomplete; runner teardown will recycle the VM'
            exit 1
          fi
          echo 'Isolated database stopped; private runner files deleted.'
