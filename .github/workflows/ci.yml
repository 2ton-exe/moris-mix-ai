name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  production-ownership:
    name: Select production owner
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.select.outputs.owner }}
    steps:
      # Actions string equality ignores case. Compare the raw variable in Node.
      - name: Select exact-string owner
        id: select
        env:
          MODULAR_PRODUCTION_ENABLED: ${{ vars.MODULAR_PRODUCTION_ENABLED }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const owner = process.env.MODULAR_PRODUCTION_ENABLED === "true" ? "modular" : "legacy";
            appendFileSync(process.env.GITHUB_OUTPUT, "owner=" + owner + "\n");
          '

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      exists: ${{ steps.frontend.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend project not added yet."
          fi

      - name: Set up pnpm
        if: steps.frontend.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run PR Secretary regression tests
        working-directory: .
        run: node --test scripts/pr-secretary.test.mjs

      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test runtime smoke verifier (offline)
        run: node --test scripts/runtime-smoke.test.mjs

      - name: Test production workflow safety (offline)
        run: node --test scripts/production-workflow.test.mjs

      - name: Run lint
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend tests
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build

  test-e2e:
    name: Playwright E2E (Non-gating)
    uses: ./.github/workflows/reusable-e2e.yml

  test-db:
    name: Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      RUN_MIGRATION_DB_TESTS: "true"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL readiness
        run: |
          node -e "
            import('pg').then(async ({ Client }) => {
              const url = process.env.DATABASE_URL;
              for (let i = 0; i < 30; i++) {
                try {
                  const client = new Client({ connectionString: url, ssl: false, connectionTimeoutMillis: 2000 });
                  await client.connect();
                  await client.query('SELECT 1;');
                  await client.end();
                  console.log('PostgreSQL service container is ready and accepting connections.');
                  return;
                } catch (err) {
                  await new Promise((r) => setTimeout(r, 1000));
                }
              }
              console.error('Timed out waiting for PostgreSQL service container.');
              process.exit(1);
            });
          "

      - name: Run database migrations
        run: pnpm run db:setup

      - name: Run migration tests
        run: pnpm run test:lifecycle

      - name: Run RLS tests
        run: pnpm test:db

  test-edge-api:
    name: Edge/API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"

      - name: Type-check Edge Function and tests
        run: deno check --frozen-lockfile --node-modules-dir=auto supabase/functions/_shared/auth.ts supabase/functions/_shared/ai/recipeContext.ts supabase/functions/demo-recipe/index.ts supabase/functions/auth-session/index.ts supabase/functions/recipes/index.ts supabase/functions/extract-recipe/index.ts supabase/functions/tests/demo_recipe_test.ts supabase/functions/tests/auth_test.ts supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts supabase/functions/tests/ai_contracts_test.ts supabase/functions/tests/eval_dataset_test.ts supabase/functions/tests/cross_user_rls_lineage_test.ts supabase/functions/tests/recipe_context_test.ts supabase/functions/tests/gemini_adapter_test.ts supabase/functions/tests/extract_recipe_test.ts

      - name: Run deterministic Edge/API tests
        run: deno test --frozen-lockfile --node-modules-dir=auto --allow-env --allow-read=fixtures/demo-recipe.json supabase/functions/tests/demo_recipe_test.ts supabase/functions/tests/auth_test.ts supabase/functions/tests/recipes_test.ts supabase/functions/tests/ai_contracts_test.ts supabase/functions/tests/eval_dataset_test.ts supabase/functions/tests/cross_user_rls_lineage_test.ts supabase/functions/tests/recipe_context_test.ts supabase/functions/tests/gemini_adapter_test.ts supabase/functions/tests/extract_recipe_test.ts

      - name: Check hosted migration configuration
        id: hosted-migration
        env:
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY }}
          NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_URL }}
        shell: bash
        run: |
          if [[ -n "${NON_PRODUCTION_TEST_DATABASE_URL//[[:space:]]/}" && -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL//[[:space:]]/}" && ( -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY//[[:space:]]/}" || -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY//[[:space:]]/}" ) && ( -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY//[[:space:]]/}" || -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY//[[:space:]]/}" ) && ( -n "${NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF//[[:space:]]/}" || -n "${NON_PRODUCTION_TEST_DATABASE_PROJECT_REF//[[:space:]]/}" ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm for hosted test migrations
        if: steps.hosted-migration.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js for hosted test migrations
        if: steps.hosted-migration.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repository tooling dependencies
        if: steps.hosted-migration.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrate dedicated hosted RLS test database
        if: steps.hosted-migration.outputs.run == 'true'
        env:
          RUN_NON_PRODUCTION_TEST_DATABASE_RLS_INTEGRATION: "true"
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY }}
          NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_URL }}
        run: node run-migrations.mjs --test-target

      - name: Run non-production test database RLS integration test
        env:
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY }}
          NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_URL }}
        shell: bash
        run: |
          if [[ -n "${NON_PRODUCTION_TEST_DATABASE_URL//[[:space:]]/}" && -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL//[[:space:]]/}" && ( -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY//[[:space:]]/}" || -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY//[[:space:]]/}" ) && ( -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY//[[:space:]]/}" || -n "${NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY//[[:space:]]/}" ) && ( -n "${NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF//[[:space:]]/}" || -n "${NON_PRODUCTION_TEST_DATABASE_PROJECT_REF//[[:space:]]/}" ) ]]; then
            RUN_NON_PRODUCTION_TEST_DATABASE_RLS_INTEGRATION=true deno test --frozen-lockfile --node-modules-dir=auto --allow-env --allow-net supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts supabase/functions/tests/recipe_context_test.ts
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "SKIPPED: Non-production test database RLS integration test safely skipped for untrusted fork pull request where repository secrets are withheld."
            deno test --frozen-lockfile --node-modules-dir=auto --allow-env supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts supabase/functions/tests/recipe_context_test.ts
          elif [[ "${REQUIRE_HOSTED_RLS_INTEGRATION}" == "true" ]]; then
            echo "ERROR: Hosted RLS integration test is required but non-production test database configuration is missing." >&2
            exit 1
          else
            echo "SKIPPED: Non-production test database RLS integration test not executed because dedicated non-production test project configuration is not completely configured."
            deno test --frozen-lockfile --node-modules-dir=auto --allow-env supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts supabase/functions/tests/recipe_context_test.ts
          fi

  test-hosted-rls:
    name: Hosted RLS Integration
    needs: test-edge-api
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"

      - name: Run hosted RLS integration tests
        env:
          REQUIRE_HOSTED_RLS_INTEGRATION: "true"
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY }}
          NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY }}
          NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
          NON_PRODUCTION_TEST_DATABASE_PROJECT_REF: ${{ vars.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
        shell: bash
        run: |
          deno test --frozen-lockfile --node-modules-dir=auto --allow-env --allow-net --filter "hosted integration" supabase/functions/tests/cross_user_rls_lineage_test.ts supabase/functions/tests/recipe_context_test.ts

  deploy:
    name: Deploy to Supabase and Cloudflare
    needs:
      - frontend
      - test-db
      - test-edge-api
      - test-hosted-rls
      - production-ownership
    if: success() && needs.production-ownership.outputs.owner == 'legacy' && needs.frontend.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-production.yml
    permissions:
      contents: read
    with:
      owner: legacy
      frontend-exists: ${{ needs.frontend.outputs.exists == 'true' }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
