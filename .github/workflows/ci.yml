name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    outputs:
      exists: ${{ steps.frontend.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend project not added yet."
          fi

      - name: Set up pnpm
        if: steps.frontend.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run lint
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend tests
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build

  test-db:
    name: Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      RUN_MIGRATION_DB_TESTS: "true"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PostgreSQL readiness
        run: |
          node -e "
            import('pg').then(async ({ Client }) => {
              const url = process.env.DATABASE_URL;
              for (let i = 0; i < 30; i++) {
                try {
                  const client = new Client({ connectionString: url, ssl: false, connectionTimeoutMillis: 2000 });
                  await client.connect();
                  await client.query('SELECT 1;');
                  await client.end();
                  console.log('PostgreSQL service container is ready and accepting connections.');
                  return;
                } catch (err) {
                  await new Promise((r) => setTimeout(r, 1000));
                }
              }
              console.error('Timed out waiting for PostgreSQL service container.');
              process.exit(1);
            });
          "

      - name: Run database migrations
        run: pnpm run db:setup

      - name: Run migration tests
        run: pnpm run test:lifecycle

      - name: Run RLS tests
        run: pnpm test:db
        
  test-edge-api:
    name: Edge/API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"

      - name: Type-check Edge Function and tests
        run: deno check --frozen-lockfile --node-modules-dir=auto supabase/functions/_shared/auth.ts supabase/functions/demo-recipe/index.ts supabase/functions/auth-session/index.ts supabase/functions/recipes/index.ts supabase/functions/tests/demo_recipe_test.ts supabase/functions/tests/auth_test.ts supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts

      - name: Run deterministic Edge/API tests
        run: deno test --frozen-lockfile --node-modules-dir=auto --allow-env --allow-read=fixtures/demo-recipe.json supabase/functions/tests/demo_recipe_test.ts supabase/functions/tests/auth_test.ts supabase/functions/tests/recipes_test.ts

      - name: Run hosted RLS integration test (optional)
        env:
          BE04_RLS_TEST_SUPABASE_URL: ${{ secrets.BE04_RLS_TEST_SUPABASE_URL }}
          BE04_RLS_TEST_SUPABASE_ANON_KEY: ${{ secrets.BE04_RLS_TEST_SUPABASE_ANON_KEY }}
          BE04_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BE04_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          BE04_RLS_TEST_SUPABASE_SECRET_KEY: ${{ secrets.BE04_RLS_TEST_SUPABASE_SECRET_KEY }}
          BE04_RLS_TEST_EXPECTED_PROJECT_REF: ${{ vars.BE04_RLS_TEST_EXPECTED_PROJECT_REF || secrets.BE04_RLS_TEST_EXPECTED_PROJECT_REF || vars.BE04_RLS_TEST_PROJECT_REF || secrets.BE04_RLS_TEST_PROJECT_REF }}
          BE04_RLS_TEST_DATABASE_URL: ${{ secrets.BE04_RLS_TEST_DATABASE_URL }}
          BE06_RLS_TEST_SUPABASE_URL: ${{ secrets.BE06_RLS_TEST_SUPABASE_URL }}
          BE06_RLS_TEST_SUPABASE_ANON_KEY: ${{ secrets.BE06_RLS_TEST_SUPABASE_ANON_KEY }}
          BE06_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BE06_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          BE06_RLS_TEST_SUPABASE_SECRET_KEY: ${{ secrets.BE06_RLS_TEST_SUPABASE_SECRET_KEY }}
          BE06_RLS_TEST_EXPECTED_PROJECT_REF: ${{ vars.BE06_RLS_TEST_EXPECTED_PROJECT_REF || secrets.BE06_RLS_TEST_EXPECTED_PROJECT_REF || vars.BE06_RLS_TEST_PROJECT_REF || secrets.BE06_RLS_TEST_PROJECT_REF }}
          BE06_RLS_TEST_DATABASE_URL: ${{ secrets.BE06_RLS_TEST_DATABASE_URL }}
        shell: bash
        run: |
          if [[ -n "${BE06_RLS_TEST_SUPABASE_URL//[[:space:]]/}" && -n "${BE06_RLS_TEST_SUPABASE_ANON_KEY//[[:space:]]/}" && ( -n "${BE06_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY//[[:space:]]/}" || -n "${BE06_RLS_TEST_SUPABASE_SECRET_KEY//[[:space:]]/}" ) && -n "${BE06_RLS_TEST_EXPECTED_PROJECT_REF//[[:space:]]/}" ]]; then
            RUN_BE06_RLS_INTEGRATION=true deno run --frozen-lockfile --node-modules-dir=auto --allow-read --allow-env --allow-net run-migrations.mjs --test-target
            RUN_BE06_RLS_INTEGRATION=true deno test --frozen-lockfile --node-modules-dir=auto --allow-env --allow-net supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts
          elif [[ -n "${BE04_RLS_TEST_SUPABASE_URL//[[:space:]]/}" && -n "${BE04_RLS_TEST_SUPABASE_ANON_KEY//[[:space:]]/}" && ( -n "${BE04_RLS_TEST_SUPABASE_SERVICE_ROLE_KEY//[[:space:]]/}" || -n "${BE04_RLS_TEST_SUPABASE_SECRET_KEY//[[:space:]]/}" ) && -n "${BE04_RLS_TEST_EXPECTED_PROJECT_REF//[[:space:]]/}" ]]; then
            RUN_BE04_RLS_INTEGRATION=true deno run --frozen-lockfile --node-modules-dir=auto --allow-read --allow-env --allow-net run-migrations.mjs --test-target
            RUN_BE04_RLS_INTEGRATION=true deno test --frozen-lockfile --node-modules-dir=auto --allow-env --allow-net supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts
          else
            echo "SKIPPED: Hosted RLS integration test not executed because dedicated non-production test project configuration is not completely configured."
            deno test --frozen-lockfile --node-modules-dir=auto --allow-env supabase/functions/tests/auth_rls_integration_test.ts supabase/functions/tests/recipes_test.ts
          fi

  deploy:
    name: Deploy to Cloudflare
    needs:
      - frontend
      - test-db
      - test-edge-api
    if: needs.frontend.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: cloudflare-production
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate public Supabase build configuration
        shell: bash
        run: |
          if [[ -z "${VITE_SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Configure the VITE_SUPABASE_URL repository variable."
            exit 1
          fi
          public_key="${VITE_SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [[ -z "${public_key//[[:space:]]/}" ]]; then
            echo "::error::Configure the VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY repository variable."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
