name: Reusable Staging Deployment

on:
  workflow_call:
    secrets:
      STAGING_CLOUDFLARE_API_TOKEN:
        required: true
      STAGING_CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: moris-mix-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    outputs:
      deployment-url: ${{ steps.verify-deployment.outputs.deployment-url }}

    permissions:
      contents: read

    env:
      STAGING_WORKER_NAME: ${{ vars.STAGING_WORKER_NAME }}
      STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staging configuration
        shell: bash
        env:
          STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          required=(
            STAGING_WORKER_NAME
            STAGING_FRONTEND_URL
            STAGING_SUPABASE_PROJECT_REF
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            STAGING_CLOUDFLARE_API_TOKEN
            STAGING_CLOUDFLARE_ACCOUNT_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing staging configuration: $name"
              exit 1
            fi
          done

          expected_url="https://${STAGING_SUPABASE_PROJECT_REF}.supabase.co"

          if [[ "$VITE_SUPABASE_URL" != "$expected_url" ]]; then
            echo "::error::Staging Supabase URL does not match the staging project reference."
            exit 1
          fi

          if [[ "$STAGING_WORKER_NAME" != "moris-mix-ai-staging" ]]; then
            echo "::error::Unexpected Cloudflare staging Worker name."
            exit 1
          fi

          if [[ "${STAGING_FRONTEND_URL%/}" != https://${STAGING_WORKER_NAME}.*.workers.dev ]]; then
            echo "::error::Staging frontend URL does not match the staging Worker."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build staging frontend
        working-directory: frontend
        run: pnpm build

      - name: Deploy staging Worker
        id: deploy-staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc --env staging

      - name: Verify staging deployment URL
        id: verify-deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-staging.outputs.deployment-url }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Wrangler did not report a staging deployment URL."
            exit 1
          fi

          deployment_url="${DEPLOYMENT_URL%/}"
          expected_url="${STAGING_FRONTEND_URL%/}"

          if [[ "$deployment_url" != "$expected_url" ]]; then
            echo "::error::Wrangler deployment URL does not match STAGING_FRONTEND_URL."
            exit 1
          fi

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record deployment evidence
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERIFIED_DEPLOYMENT_URL: ${{ steps.verify-deployment.outputs.deployment-url }}
        run: |
          {
            echo "### Staging deployment"
            echo "- PR head: \`${PR_HEAD_SHA}\`"
            echo "- Tested merge revision: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${STAGING_WORKER_NAME}\`"
            echo "- URL: ${VERIFIED_DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Staging Smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging

    env:
      STAGING_FRONTEND_URL: ${{ needs.deploy.outputs.deployment-url }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify deployed frontend
        shell: bash
        run: |
          set -euo pipefail

          base="${STAGING_FRONTEND_URL%/}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          verify_origin() {
            if ! node -e '
              try {
                process.exit(new URL(process.argv[1]).origin === new URL(process.argv[2]).origin ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$base" "$1"; then
              echo "::error::Staging $2 final effective URL is invalid or outside the verified STAGING_FRONTEND_URL origin."
              exit 1
            fi
          }

          success=false

          for attempt in 1 2 3 4 5; do
            if response="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 5 \
                --max-time 15 \
                --output "$temp_dir/home.html" \
                --write-out "%{http_code} %{content_type}\n%{url_effective}" \
                "${base}/home?revision=${GITHUB_SHA}"
            )"; then
              verify_origin "${response##*$'\n'}" "/home"
              response="${response%$'\n'*}"

              if [[ "${response,,}" == "200 text/html" || "${response,,}" == "200 text/html;"* ]]; then
                success=true
                break
              fi
            fi

            if [[ "$attempt" -lt 5 ]]; then
              sleep 5
            fi
          done

          if [[ "$success" != "true" ]]; then
            echo "::error::Staging /home did not return HTTP 200 with HTML content type."
            exit 1
          fi

          asset="$(
            awk 'match($0, /src="[^"]*assets\/[^"]+\.js"/) {
              print substr($0, RSTART + 5, RLENGTH - 6)
              exit
            }' "$temp_dir/home.html"
          )"

          if [[ -z "$asset" ]]; then
            echo "::error::Could not find the built JavaScript asset."
            exit 1
          fi

          if [[ "$asset" == /* ]]; then
            asset_url="${base}${asset}"
          else
            asset_url="${base}/${asset}"
          fi

          success=false

          for attempt in 1 2 3 4 5; do
            if asset_response="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 5 \
                --max-time 15 \
                --output "$temp_dir/asset.js" \
                --write-out "%{http_code} %{content_type}\n%{url_effective}" \
                "$asset_url"
            )"; then
              verify_origin "${asset_response##*$'\n'}" "JavaScript asset"
              asset_response="${asset_response%$'\n'*}"
              asset_status="${asset_response%% *}"
              asset_content_type="${asset_response#* }"
              asset_content_type="${asset_content_type%%;*}"
              asset_content_type="${asset_content_type,,}"

              if [[ "$asset_status" == "200" && "$asset_content_type" != *html* &&
                    ( "$asset_content_type" == *javascript* || "$asset_content_type" == *ecmascript* ) ]]; then
                success=true
                break
              fi
            fi

            if [[ "$attempt" -lt 5 ]]; then
              sleep 5
            fi
          done

          if [[ "$success" != "true" ]]; then
            echo "::error::Staging JavaScript asset did not return HTTP 200 with JavaScript content type (HTML fallback is rejected)."
            exit 1
          fi

          echo "Staging frontend smoke passed."

      - name: Record smoke evidence
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### Staging smoke"
            echo "- PR head: \`${PR_HEAD_SHA}\`"
            echo "- Tested merge revision: \`${GITHUB_SHA}\`"
            echo "- URL: ${STAGING_FRONTEND_URL}"
            echo "- Frontend HTML: passed"
            echo "- JavaScript asset: passed"
          } >> "$GITHUB_STEP_SUMMARY"
