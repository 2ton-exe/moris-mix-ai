name: Reusable Staging Deployment

on:
  workflow_call:
    secrets:
      STAGING_CLOUDFLARE_API_TOKEN:
        required: true
      STAGING_CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: moris-mix-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    outputs:
      deployment-url: ${{ steps.verify-deployment.outputs.deployment-url }}

    permissions:
      contents: read

    env:
      STAGING_WORKER_NAME: ${{ vars.STAGING_WORKER_NAME }}
      STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_DEMO_RECIPE_REVISION: ${{ vars.STAGING_DEMO_RECIPE_REVISION }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staging configuration
        shell: bash
        env:
          STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          required=(
            STAGING_WORKER_NAME
            STAGING_FRONTEND_URL
            STAGING_SUPABASE_PROJECT_REF
            STAGING_DEMO_RECIPE_REVISION
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            STAGING_CLOUDFLARE_API_TOKEN
            STAGING_CLOUDFLARE_ACCOUNT_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing staging configuration: $name"
              exit 1
            fi
          done

          if [[ "$STAGING_SUPABASE_PROJECT_REF" != "pjeykhjzqhryjwuoizgh" ||
                ! "$STAGING_DEMO_RECIPE_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Unexpected staging project or missing demo-recipe source SHA."
            exit 1
          fi

          expected_url="https://${STAGING_SUPABASE_PROJECT_REF}.supabase.co"

          if [[ "$VITE_SUPABASE_URL" != "$expected_url" ]]; then
            echo "::error::Staging Supabase URL does not match the staging project reference."
            exit 1
          fi

          if [[ "$STAGING_WORKER_NAME" != "moris-mix-ai-staging" ]]; then
            echo "::error::Unexpected Cloudflare staging Worker name."
            exit 1
          fi

          if [[ "${STAGING_FRONTEND_URL%/}" != https://${STAGING_WORKER_NAME}.*.workers.dev ]]; then
            echo "::error::Staging frontend URL does not match the staging Worker."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build staging frontend
        working-directory: frontend
        run: pnpm build

      - name: Deploy staging Worker
        id: deploy-staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc --env staging

      - name: Verify staging deployment URL
        id: verify-deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-staging.outputs.deployment-url }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Wrangler did not report a staging deployment URL."
            exit 1
          fi

          deployment_url="${DEPLOYMENT_URL%/}"
          expected_url="${STAGING_FRONTEND_URL%/}"

          if [[ "$deployment_url" != "$expected_url" ]]; then
            echo "::error::Wrangler deployment URL does not match STAGING_FRONTEND_URL."
            exit 1
          fi

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record deployment evidence
        if: always()
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_OUTCOME: ${{ steps.deploy-staging.outcome }}
          URL_VERIFICATION_OUTCOME: ${{ steps.verify-deployment.outcome }}
          VERIFIED_DEPLOYMENT_URL: ${{ steps.verify-deployment.outputs.deployment-url }}
        run: |
          {
            echo "### Staging deployment"
            echo "- Deployment command: ${DEPLOYMENT_OUTCOME}"
            echo "- Deployment URL verification: ${URL_VERIFICATION_OUTCOME}"
            echo "- PR head: \`${PR_HEAD_SHA}\`"
            echo "- Tested merge revision: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${STAGING_WORKER_NAME}\`"
            echo "- URL: ${VERIFIED_DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Staging Smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging

    permissions:
      contents: read

    env:
      SMOKE_ENVIRONMENT: staging
      SMOKE_DEPLOYMENT_OUTCOME: ${{ needs.deploy.result }}
      SMOKE_FRONTEND_URL: ${{ needs.deploy.outputs.deployment-url }}
      SMOKE_SUPABASE_URL: https://example.invalid
      SMOKE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SMOKE_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SMOKE_BACKEND_REVISION: ${{ vars.STAGING_DEMO_RECIPE_REVISION }}
      SMOKE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify deployed frontend and demo database path
        run: node scripts/runtime-smoke.mjs

      - name: Preserve runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-smoke.json
          if-no-files-found: warn
