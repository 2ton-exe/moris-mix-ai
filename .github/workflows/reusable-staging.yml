name: Reusable Staging Deployment

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: moris-mix-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging Deploy
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read

    env:
      STAGING_WORKER_NAME: ${{ vars.STAGING_WORKER_NAME }}
      STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            STAGING_WORKER_NAME
            STAGING_FRONTEND_URL
            STAGING_SUPABASE_PROJECT_REF
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing staging configuration: $name"
              exit 1
            fi
          done

          expected_url="https://${STAGING_SUPABASE_PROJECT_REF}.supabase.co"

          if [[ "$VITE_SUPABASE_URL" != "$expected_url" ]]; then
            echo "::error::Staging Supabase URL does not match the staging project reference."
            exit 1
          fi

          if [[ "$STAGING_WORKER_NAME" != "moris-mix-ai-staging" ]]; then
            echo "::error::Unexpected Cloudflare staging Worker name."
            exit 1
          fi

          if [[ "$STAGING_FRONTEND_URL" != https://${STAGING_WORKER_NAME}.*.workers.dev ]]; then
            echo "::error::Staging frontend URL does not match the staging Worker."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build staging frontend
        working-directory: frontend
        run: pnpm build

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc --env staging

      - name: Record deployment evidence
        shell: bash
        run: |
          {
            echo "### Staging deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker: \`${STAGING_WORKER_NAME}\`"
            echo "- URL: ${STAGING_FRONTEND_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Staging Smoke
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging

    env:
      STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}

    steps:
      - name: Verify deployed frontend
        shell: bash
        run: |
          set -euo pipefail

          base="${STAGING_FRONTEND_URL%/}"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          success=false

          for attempt in 1 2 3 4 5; do
            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output "$temp_dir/home.html" \
                --dump-header "$temp_dir/home.headers" \
                --write-out "%{http_code}" \
                "${base}/home?revision=${GITHUB_SHA}"
            )"

            if [[ "$status" == "200" ]]; then
              success=true
              break
            fi

            sleep 5
          done

          if [[ "$success" != "true" ]]; then
            echo "::error::Staging /home did not return HTTP 200."
            exit 1
          fi

          if ! grep -qi '^content-type:.*text/html' "$temp_dir/home.headers"; then
            echo "::error::Staging /home did not return HTML."
            exit 1
          fi

          asset="$(
            grep -oE 'src="[^"]*assets/[^"]+\.js"' "$temp_dir/home.html" \
              | head -n 1 \
              | cut -d'"' -f2
          )"

          if [[ -z "$asset" ]]; then
            echo "::error::Could not find the built JavaScript asset."
            exit 1
          fi

          if [[ "$asset" == /* ]]; then
            asset_url="${base}${asset}"
          else
            asset_url="${base}/${asset}"
          fi

          asset_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$temp_dir/asset.js" \
              --dump-header "$temp_dir/asset.headers" \
              --write-out "%{http_code}" \
              "$asset_url"
          )"

          if [[ "$asset_status" != "200" ]]; then
            echo "::error::Staging JavaScript asset did not return HTTP 200."
            exit 1
          fi

          echo "Staging frontend smoke passed."

      - name: Record smoke evidence
        shell: bash
        run: |
          {
            echo "### Staging smoke"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${STAGING_FRONTEND_URL}"
            echo "- Frontend HTML: passed"
            echo "- JavaScript asset: passed"
          } >> "$GITHUB_STEP_SUMMARY"
