name: Modular Main Validation

# Permanent main validation and sole production caller after legacy CI retirement.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy-upload-signing:
        description: Deploy the upload-signing function after production readiness review
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  frontend:
    name: Modular Main Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  test-db:
    name: Modular Main Database
    uses: ./.github/workflows/reusable-database.yml

  test-edge-api:
    name: Modular Main Edge/API
    uses: ./.github/workflows/reusable-edge-api.yml
    with:
      require-hosted-rls: true
    secrets:
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY }}
      NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
      NON_PRODUCTION_TEST_DATABASE_PROJECT_REF: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
      NON_PRODUCTION_TEST_DATABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_URL }}

  test-e2e:
    name: Modular Main E2E
    uses: ./.github/workflows/reusable-e2e.yml

  production:
    name: Modular Main Production
    needs: [frontend, test-db, test-edge-api]
    if: >-
      success() &&
      needs.frontend.outputs.exists == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-production.yml
    permissions:
      contents: read
    with:
      frontend-exists: ${{ needs.frontend.outputs.exists == 'true' }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-upload-signing:
    name: Deploy protected upload-signing function
    needs: production
    if: >-
      success() && (inputs.deploy-upload-signing || false) &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: recipe-image-upload-production
    concurrency:
      group: recipe-image-upload-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify upload-signing production readiness
        id: upload-signing-readiness
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ALLOWED_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_URL }}
          UPLOAD_SIGNING_READINESS_ATTESTATION: ${{ secrets.UPLOAD_SIGNING_READINESS_ATTESTATION }}
        run: node scripts/verify-upload-signing-readiness.mjs

      - name: Reject stale upload-signing revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Current main is ${current_sha}; refusing to deploy stale revision ${GITHUB_SHA}."
            exit 1
          fi

      - name: Deploy recipe image upload URL Edge Function
        id: deploy-recipe-image-upload-url
        if: success() && steps.upload-signing-readiness.outcome == 'success'
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm exec supabase --workdir "$GITHUB_WORKSPACE" functions deploy recipe-image-upload-url \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Record upload-signing deployment outcome
        if: always()
        env:
          READINESS_OUTCOME: ${{ steps.upload-signing-readiness.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deploy-recipe-image-upload-url.outcome }}
        run: |
          {
            echo "### Upload-signing production deployment"
            echo "- Readiness verification: ${READINESS_OUTCOME}"
            echo "- Deployment command: ${DEPLOYMENT_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
