name: Modular Main Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Modular Main Frontend
    uses: ./.github/workflows/reusable-frontend.yml

  test-db:
    name: Modular Main Database
    uses: ./.github/workflows/reusable-database.yml

  test-edge-api:
    name: Modular Main Edge/API
    uses: ./.github/workflows/reusable-edge-api.yml
    with:
      require-hosted-rls: true
    secrets:
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_URL }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_ANON_KEY }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_PUBLISHABLE_KEY }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SERVICE_ROLE_KEY }}
      NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_SUPABASE_SECRET_KEY }}
      NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_EXPECTED_PROJECT_REF || secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
      NON_PRODUCTION_TEST_DATABASE_PROJECT_REF: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_PROJECT_REF }}
      NON_PRODUCTION_TEST_DATABASE_URL: ${{ secrets.NON_PRODUCTION_TEST_DATABASE_URL }}

  test-e2e:
    name: Modular Main E2E
    uses: ./.github/workflows/reusable-e2e.yml

  production:
    name: Modular Main Production
    needs: [frontend, test-db, test-edge-api]
    if: >-
      success() && needs.frontend.outputs.exists == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-production.yml
    permissions:
      contents: read
    with:
      frontend-exists: ${{ needs.frontend.outputs.exists == 'true' }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
