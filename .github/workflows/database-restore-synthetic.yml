name: Database Restore Synthetic Compatibility

# Unprivileged PR-only diagnostic; never reads the R2 backup or hosted databases.
on:
  pull_request:
    paths:
      - .github/workflows/database-restore-synthetic.yml
      - .github/workflows/database-restore-stage-b.yml
      - .github/workflows/database-restore-role-diagnostic.yml
      - scripts/owner_restore_diagnostic.py
      - scripts/owner_restore_network_guard.py
      - scripts/verify_restore_archive.py
      - scripts/restore_role_probe.py
      - scripts/test_restore_role_probe.py
      - scripts/test_database_restore_synthetic.sh
      - scripts/test_database_restore_owner_reconstruction.sh
      - scripts/test_database_restore_archive_verifier.py
      - scripts/test_database_restore_owner_diagnostic.py
      - scripts/test_database_restore_network_guard.py
      - scripts/test_database_restore_failure_locations.py
      - scripts/test_database_restore_data_failure.py
      - scripts/restore_candidate_manifest.py
      - scripts/test_database_restore_candidate_manifest.py
      - scripts/restore_deployment_authorization.py
      - scripts/test_database_restore_authorization.py
      - scripts/restore_runner_network_guard.py
      - scripts/test_database_restore_runner_network_guard.py
      - scripts/restore_data_failure.py
      - scripts/test_database_restore_drill.py
      - scripts/classify_restore_component.py
      - scripts/verify_restore_foreign_keys.sql
      - scripts/restore_auth_profile_trigger.sql
      - supabase/migrations/20261013000000_initial_schema.sql

permissions:
  contents: read

jobs:
  synthetic-restore:
    name: Credential-free PostgreSQL 17 restore compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Same pinned patched PostgreSQL client used by Stage B.
      PSQL_IMAGE: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    steps:
      - name: Checkout synthetic test only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Install nftables for temporary runner isolation guard
        shell: bash
        run: command -v nft >/dev/null || sudo apt-get install -y nftables

      - name: Test role-only diagnostic output safety (offline)
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_restore_role_probe.py'

      - name: Test restore diagnostics and synthetic cleanup (offline)
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_database_restore_*.py'

      - name: Check synthetic shell syntax (offline)
        shell: bash
        run: |
          bash -n scripts/test_database_restore_synthetic.sh
          bash -n scripts/test_database_restore_owner_reconstruction.sh

      - name: Exercise synthetic transactional restore and rollback
        shell: bash
        run: bash scripts/test_database_restore_synthetic.sh

      - name: Exercise owner diagnostic reconstruction and cleanup
        shell: bash
        env:
          OWNER_RESTORE_LIVE_GUARD: "1"
        run: |
          command -v nft >/dev/null || sudo apt-get install -y nftables
          timeout --kill-after=20s 3m bash scripts/test_database_restore_owner_reconstruction.sh
