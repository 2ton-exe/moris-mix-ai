name: Database Restore Synthetic Compatibility

# Unprivileged PR-only diagnostic; never reads the R2 backup or hosted databases.
on:
  pull_request:
    paths:
      - .github/workflows/database-restore-synthetic.yml
      - scripts/test_database_restore_synthetic.sh

permissions:
  contents: read

jobs:
  synthetic-restore:
    name: Credential-free PostgreSQL 17 restore compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Same pinned patched PostgreSQL client used by Stage B.
      PSQL_IMAGE: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    steps:
      - name: Checkout synthetic test only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.122.0

      - name: Exercise synthetic transactional restore and rollback
        shell: bash
        run: bash scripts/test_database_restore_synthetic.sh
