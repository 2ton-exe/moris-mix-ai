name: Reusable Playwright E2E Validation

on:
  workflow_call:

jobs:
  e2e-chromium:
    name: Playwright E2E (chromium)
    uses: ./.github/workflows/reusable-e2e-browser.yml
    with:
      browser: chromium

  e2e-firefox:
    name: Playwright E2E (firefox)
    uses: ./.github/workflows/reusable-e2e-browser.yml
    with:
      browser: firefox

  e2e-webkit:
    name: Playwright E2E (webkit)
    uses: ./.github/workflows/reusable-e2e-browser.yml
    with:
      browser: webkit

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-chromium, e2e-firefox, e2e-webkit]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Require every browser job to pass
        env:
          E2E_CHROMIUM_RESULT: ${{ needs.e2e-chromium.result }}
          E2E_FIREFOX_RESULT: ${{ needs.e2e-firefox.result }}
          E2E_WEBKIT_RESULT: ${{ needs.e2e-webkit.result }}
        run: |
          if [[ "$E2E_CHROMIUM_RESULT" != "success" || "$E2E_FIREFOX_RESULT" != "success" || "$E2E_WEBKIT_RESULT" != "success" ]]; then
            echo "Browser E2E results: chromium=$E2E_CHROMIUM_RESULT firefox=$E2E_FIREFOX_RESULT webkit=$E2E_WEBKIT_RESULT"
            exit 1
          fi
